[pytest]
addopts = --strict-markers
markers =
    persona_regression: E2E persona-driven regression tests.
    persona_fast: Fast persona subset (FIRE + HighEarner) for pre-push checks (<5s target).
filterwarnings =
    # slowapi still calls asyncio.iscoroutinefunction (deprecated in 3.14); only that call is silenced.
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi.extension

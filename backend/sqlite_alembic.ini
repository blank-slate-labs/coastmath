# Migrations for a self-hosted SQLite database; the app applies them at startup.
# After a model change, upgrade a scratch database, then autogenerate:
#   DATABASE_URL=sqlite:////tmp/schema.db venv/bin/alembic -c sqlite_alembic.ini upgrade head
#   DATABASE_URL=sqlite:////tmp/schema.db venv/bin/alembic -c sqlite_alembic.ini revision --autogenerate -m "describe the change"
[alembic]
script_location = sqlite_migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
